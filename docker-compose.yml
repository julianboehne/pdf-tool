services:
  pdf-tool:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8083:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # prevents the host from shadowing the container's install
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
